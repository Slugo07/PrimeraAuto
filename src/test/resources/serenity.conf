webdriver {
    driver = chrome
    close.browser = false

    timeouts {
        implicitlywait = 5000
        fluentwait = 10000
    }

    base.url = "https://www.saucedemo.com"
}

chrome {
    switches = [
        "--start-maximized",
        "--disable-popup-blocking",
        "--disable-default-apps",
        "--incognito",
        "--disable-infobars",
        "--disable-gpu"
    ]
}

environments {
    default {
        webdriver.base.url = "https://www.saucedemo.com"
    }
}
